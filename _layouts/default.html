<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% seo %}
    <!-- Cloudflare Web Analytics -->
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "ee6271e0bec3475c9a057bef91ebd5fa"}'></script>
    <!-- End Cloudflare Web Analytics -->
  </head>
  <body>
    <header class="header">
      <div class="container nav">
        <a href="{{ '/' | relative_url }}"><strong>{{ site.title }}</strong></a>
        <nav>
          <a href="{{ '/' | relative_url }}">Início</a>
          <a href="{{ '/sobre/' | relative_url }}">Sobre</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <article class="card">
        {% if page.title and page.url != '/' %}
          <h1>{{ page.title }}</h1>
        {% endif %}
        {{ content }}

        {% if page.url != '/' and page.url != '/sobre/' %}
          <hr style="margin: 40px 0; border: 0; border-top: 1px solid var(--border);">
          <section>
            <h2>Comentários</h2>
            <script src="https://giscus.app/client.js"
              data-repo="mauriciokj/mauriciokj.github.io"
              data-repo-id="MDEwOlJlcG9zaXRvcnkzODg0OTE0Ng=="
              data-category="General"
              data-category-id="DIC_kwDOAlDKes4C4ytJ"
              data-mapping="pathname"
              data-strict="0"
              data-reactions-enabled="1"
              data-emit-metadata="0"
              data-input-position="bottom"
              data-theme="preferred_color_scheme"
              data-lang="pt"
              crossorigin="anonymous"
              async>
            </script>
          </section>
        {% endif %}
      </article>
    </main>

    <footer class="footer">
      <div class="container">
        <small>Feito com Jekyll e GitHub Pages.</small>
      </div>
    </footer>
  </body>
</html>
